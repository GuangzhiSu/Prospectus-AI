ruleset: SGX_Mainboard
ruleset_name: SGX Mainboard Rule 210 listing eligibility
version: 0.1.0-draft
in_regression_baseline: false
source_ref: SGX Mainboard Rules Chapter 2 Rule 210
gates:
- id: financial_eligibility_tests
  title: Financial eligibility — meet at least one standard / test
  rule_ref: 210(2)(a) + 210(3)(c)
  effective_from: '2025-10-29'
  evaluated: true
  human_signoff: false
  stub_reason: ""
  requirement:
    any_of:
    - all_of:
      - check:
          id: sg_s1_1
          metric: pre-tax profit latest FY (excl. non-recurrent/extraordinary items)
          input_path: financials.income_statement[period={latest_audited_fy}].pre_tax_profit_ex_nonrecurrent
          operator: '>='
          threshold:
            value: 10000000
            unit: SGD
          threshold_verified: true
          effective_from: '2025-10-29'
          effective_from_verified: true
          verified_against: 210(2)(a) + 210(3)(c)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: Audited consolidated; non-recurrent income and items outside ordinary course
            EXCLUDED per 210(3)(c); reduced from S$30M (keep in version history)
      - check:
          id: sg_s1_2
          metric: operating track record
          profile_field: operating_track_record_years
          operator: '>='
          threshold:
            value: 3
            unit: years
          threshold_verified: true
          effective_from: '2025-10-29'
          effective_from_verified: true
          verified_against: 210(2)(a)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - all_of:
      - check:
          id: sg_s2_1
          metric: profitable latest FY (pre-tax)
          input_path: financials.income_statement[period={latest_audited_fy}].pre_tax_profit_ex_nonrecurrent
          operator: '>'
          threshold:
            value: 0
            unit: SGD
          threshold_verified: true
          effective_from: '2025-10-29'
          effective_from_verified: true
          verified_against: 210(2)(b) + 210(3)(c)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: Non-recurrent exclusion of 210(3)(c) applies to BOTH (a) and (b) profit tests
      - check:
          id: sg_s2_2
          metric: operating track record
          profile_field: operating_track_record_years
          operator: '>='
          threshold:
            value: 3
            unit: years
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 210(2)(b)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: sg_s2_3
          metric: market cap (issue price x post-invitation capital)
          input_path: offering.expected_market_cap_at_listing
          operator: '>='
          threshold:
            value: 150000000
            unit: SGD
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 210(2)(b)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - all_of:
      - check:
          id: sg_s3_1
          metric: operating revenue in latest completed FY (actual or pro forma)
          input_path: financials.income_statement[period={latest_audited_fy}].revenue
          operator: '>'
          threshold:
            value: 0
            unit: SGD
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 210(2)(c)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: REIT/business-trust variant exists
      - check:
          id: sg_s3_2
          metric: market cap
          input_path: offering.expected_market_cap_at_listing
          operator: '>='
          threshold:
            value: 300000000
            unit: SGD
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 210(2)(c)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
- id: continuity_requirements
  title: Management / ownership continuity
  rule_ref: 210(3)(a)
  effective_from: '2024-04-30'
  evaluated: false
  human_signoff: false
  stub_reason: multi-market pack v1 — no fixture this phase
  requirement:
    all_of:
    - check:
        id: sg_q3_1
        metric: substantially same business AND substantially same management throughout the 3-yr track
          record
        profile_field: business_management_continuity_3y
        operator: is_true
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 210(3)(a)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        guidance_note: SGX's continuity limb — analogous to HK 8.05 / CSRC Art.12(2)
- id: public_float_requirements
  title: Public float / free float requirements
  rule_ref: 210(1)(a)
  effective_from: '2024-04-30'
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: sg_p_1e
        metric: 'offer < S$75M: >= 40% of invitation shares (or S$15M, lower) to investors each allotted
          <= 0.8% (or S$300k, lower); S$75-120M: >= 20% each <= 0.4%; >= S$120M: no requirement'
        input_path: offering.distribution_compliance
        operator: ==
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 210(1)(a)
        verified_on: '2026-07-24'
