- id: red_chip_2_1_3_fast_revenue_growth_definition
  title: Red-chip route — 2_1_3_fast_revenue_growth_definition
  rule_ref: 2.1.3 note
  effective_from: 2026-04
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: cx_rc_def
        metric: 'one of: (i) latest-FY revenue >= CNY 500M with 3-yr CAGR >= 10%; (ii) latest-FY revenue
          < CNY 500M with 3-yr CAGR >= 20%; (iii) industry in down-cycle: issuer 3-yr CAGR above comparable-company
          average'
        input_path: financials_revenue_cagr_3yr_comparable_benchmark_leaf_for_limb_i
        operator: '>='
        threshold:
          value: 10.0
          unit: '%'
        threshold_verified: true
        effective_from: 2026-04
        effective_from_verified: true
        verified_against: 2.1.3 note
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        guidance_note: 'EXEMPTION: R&D-stage red-chips and red-chips of major significance to national
          innovation-driven development strategy are EXEMPT from the fast-growth requirement (deferred
          leaf)'
        requires_llm: true
