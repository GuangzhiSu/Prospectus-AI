ruleset: CN_Main_Board
ruleset_name: SSE & SZSE Main Board (沪深主板)
version: 0.1.0-draft
in_regression_baseline: false
source_ref: SSE/SZSE 股票上市规则 (2024年4月修订) 3.1.1–3.1.5
gates:
- id: structural_requirements
  title: Structural / offering requirements
  rule_ref: SSE/SZSE 上市规则 3.1.1(二)
  effective_from: '2024-04-30'
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: mb_p0a
        metric: post-issue share capital
        input_path: offering.post_issue_share_capital
        operator: '>='
        threshold:
          value: 50000000
          unit: CNY
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: SSE/SZSE 上市规则 3.1.1(二)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - check:
        id: mb_p0b
        metric: publicly OFFERED shares as % of total share capital (公开发行比例)
        input_path: offering.public_float_pct
        operator: '>='
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 3.1.1(三)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        guidance_note: Offering-size condition at IPO — NOT an HK-style ongoing public float; two-tier
          by post-issue share capital Complex / tiered threshold (25% (10% if share capital > CNY 400M)).
        requires_llm: false
- id: financial_eligibility_tests
  title: Financial eligibility — meet at least one standard / test
  rule_ref: 3.1.2(一)
  effective_from: '2024-04-30'
  evaluated: true
  human_signoff: false
  stub_reason: ""
  requirement:
    any_of:
    - all_of:
      - check:
          id: mb_s1_1
          metric: net profit positive each of last 3 FYs
          input_path: financials.net_profit_positive_each_year[3fy]
          operator: is_true
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(一)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: 孰低 basis, audited
      - check:
          id: mb_s1_2
          metric: 3-yr aggregate net profit
          input_path: financials.net_profit_regulatory_cn_aggregate_3fy
          operator: '>='
          threshold:
            value: 200000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(一)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: 孰低 basis
      - check:
          id: mb_s1_3
          metric: latest-FY net profit
          input_path: financials.net_profit_regulatory_cn_latest
          operator: '>='
          threshold:
            value: 100000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(一)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: 孰低 basis
      - any_of:
        - check:
            id: mb_s1_4a
            metric: 3-yr aggregate operating cash flow
            input_path: financials.operating_cash_flow_aggregate_track_record
            operator: '>='
            threshold:
              value: 200000000
              unit: CNY
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 3.1.2(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
            guidance_note: OR-group with MB-S1-4b
        - check:
            id: mb_s1_4b
            metric: 3-yr aggregate revenue
            input_path: financials.revenue_aggregate_track_record
            operator: '>='
            threshold:
              value: 1500000000
              unit: CNY
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 3.1.2(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
            guidance_note: OR-group with MB-S1-4a
    - all_of:
      - check:
          id: mb_s2_1
          metric: expected market cap
          input_path: offering.expected_market_cap_at_listing
          operator: '>='
          threshold:
            value: 5000000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: Deal parameter
      - check:
          id: mb_s2_2
          metric: latest-FY net profit positive
          input_path: financials.net_profit_regulatory_cn_latest
          operator: '>'
          threshold:
            value: 0
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: 孰低
      - check:
          id: mb_s2_3
          metric: latest-FY revenue
          input_path: financials.income_statement[period={latest_audited_fy}].revenue
          operator: '>='
          threshold:
            value: 600000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: mb_s2_4
          metric: 3-yr aggregate operating cash flow
          input_path: financials.operating_cash_flow_aggregate_track_record
          operator: '>='
          threshold:
            value: 250000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - all_of:
      - check:
          id: mb_s3_1
          metric: expected market cap
          input_path: offering.expected_market_cap_at_listing
          operator: '>='
          threshold:
            value: 10000000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(三)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: mb_s3_2
          metric: latest-FY net profit positive
          input_path: financials.net_profit_regulatory_cn_latest
          operator: '>'
          threshold:
            value: 0
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(三)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: 孰低
      - check:
          id: mb_s3_3
          metric: latest-FY revenue
          input_path: financials.income_statement[period={latest_audited_fy}].revenue
          operator: '>='
          threshold:
            value: 1000000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 3.1.2(三)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
