<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Prospectus AI</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 28px; color: #17201b; background: #f6f7f4; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; color: #5d685f; font-size: 13px; }
      label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #aeb7af; border-radius: 4px; font: inherit; }
      button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 4px; color: white; background: #17201b; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Workspace sign in</h1>
    <p id="host">Enter the credentials provided by your administrator.</p>
    <form id="login-form">
      <label>Username<input id="username" autocomplete="username" required autofocus /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Sign in</button>
    </form>
    <script>
      const host = new URLSearchParams(location.search).get("host");
      if (host) document.getElementById("host").textContent = `Sign in to ${host}`;
      document.getElementById("login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        window.workspaceAuth.submit(
          document.getElementById("username").value,
          document.getElementById("password").value,
        );
      });
    </script>
  </body>
</html>
