        guidance_note: Definition gate feeding ST-RC-U1/U2
        requires_llm: true
- id: star_market_attributes
  title: STAR Market 科创属性 — cumulative indicators
  rule_ref: 科创属性评价指引
  effective_from: '2024-04-30'
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: st_at_2
        metric: R&D personnel share of headcount
        input_path: company.rd_personnel_pct
        operator: '>='
        threshold:
          value: 10.0
          unit: '%'
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 科创属性评价指引 第一条
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - check:
        id: st_at_3
        metric: invention patents applied to main business
        input_path: company.invention_patents_main_business
        operator: '>='
        threshold:
          value: 7
          unit: count
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 科创属性评价指引 第一条
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        guidance_note: Software industry EXEMPT from this patent indicator; software applies R&D ratio
          >= 10% instead (see ST-AT-1a)
    - any_of:
      - check:
          id: st_at_1a
          metric: 3-yr R&D ratio
          input_path: financials.rd_ratio_3fy_cn
          operator: '>='
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 科创属性评价指引 (2024修订) 第一条
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: 'OR-group with ST-AT-1b; cumulative with (ii)-(iv) Complex / tiered threshold
            (5% (software: 10%)).'
          requires_llm: false
      - check:
          id: st_at_1b
          metric: 3-yr aggregate R&D expenditure
          input_path: financials.rd_agg_3fy_cn
          operator: '>='
          threshold:
            value: 80000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 科创属性评价指引 第一条
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - any_of:
      - check:
          id: st_at_4a
          metric: 3-yr revenue CAGR
          input_path: financials.revenue_cagr_3yr
          operator: '>='
          threshold:
            value: 25.0
            unit: '%'
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 科创属性评价指引 第一条
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
          guidance_note: OR-group with 4b; EXEMPT for Std-5 applicants & listed-overseas red-chips
      - check:
          id: st_at_4b
          metric: latest-FY revenue
          input_path: financials.income_statement[period={latest_audited_fy}].revenue
          operator: '>='
          threshold:
            value: 300000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
