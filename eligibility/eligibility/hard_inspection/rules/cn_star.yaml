- id: red_chip_2_1_3_fast_revenue_growth_definition
  title: Red-chip route — 2_1_3_fast_revenue_growth_definition
  rule_ref: 2.1.3 note
  effective_from: '2024-04-30'
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: st_rc_def
        metric: 'if latest-FY revenue >= CNY 500M: 3-yr revenue CAGR >= 10%; if < CNY 500M: 3-yr revenue
