ruleset: CN_BSE
ruleset_name: Beijing Stock Exchange (北交所)
version: 0.1.0-draft
in_regression_baseline: false
source_ref: 北交所股票上市规则 2.1.2–2.1.3 + 北交所注册管理办法 Art.9–11
gates:
- id: structural_requirements
  title: Structural / offering requirements
  rule_ref: 北交所上市规则 2.1.2(一)
  effective_from: '2024-04-30'
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: bj_p0a
        metric: NEEQ innovation-layer continuous quotation
        profile_field: neeq_innovation_layer_months
        operator: '>='
        threshold:
          value: 12
          unit: months
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 北交所上市规则 2.1.2(一)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        guidance_note: Basic + innovation layer time cumulates
    - check:
        id: bj_p0b
        metric: latest FY-end net assets
        input_path: financials.balance_sheet[period={latest_audited_fy}].net_assets
        operator: '>='
        threshold:
          value: 50000000
          unit: CNY
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 2.1.2(三)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - check:
        id: bj_p0c
        metric: public offering size
        input_path: offering.public_offering_shares / subscribers
        operator: '>='
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 2.1.2(四)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        requires_llm: false
        guidance_note: Complex / tiered threshold (1,000,000 shares AND 100 subscribers).
    - check:
        id: bj_p0d
        metric: post-offering share capital
        input_path: offering.post_issue_share_capital
        operator: '>='
        threshold:
          value: 30000000
          unit: CNY
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 2.1.2(五)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - check:
        id: bj_p0e
        metric: post-offering shareholders
        input_path: offering.post_offering_shareholders
        operator: '>='
        threshold:
          value: 200
          unit: count
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 2.1.2(六)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - check:
        id: bj_p0f
        metric: public float
        input_path: offering.public_float_pct
        operator: '>='
        threshold_verified: true
        effective_from: '2024-04-30'
        effective_from_verified: true
        verified_against: 2.1.2(六)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        requires_llm: false
        guidance_note: Complex / tiered threshold (25% (10% if share capital > CNY 400M)).
- id: financial_eligibility_tests
  title: Financial eligibility — meet at least one standard / test
  rule_ref: 2.1.3(一)
  effective_from: '2024-04-30'
  evaluated: false
  human_signoff: false
  stub_reason: multi-market pack v1 — no fixture this phase
  requirement:
    any_of:
    - any_of:
      - all_of:
        - check:
            id: bj_s1a_1
            metric: expected market cap
            input_path: offering.expected_market_cap_at_listing
            operator: '>='
            threshold:
              value: 200000000
              unit: CNY
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 2.1.3(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        - check:
            id: bj_s1a_2
            metric: net profit each of last 2 FYs
            input_path: financials.net_profit_regulatory_cn_each[2fy]
            operator: '>='
            threshold:
              value: 15000000
              unit: CNY
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 2.1.3(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
            guidance_note: 扣非前后孰低 basis (net profit & ROE per BSE rule)
        - check:
            id: bj_s1a_3
            metric: avg weighted ROE (2 FYs)
            input_path: financials.metrics.weighted_avg_roe_avg_2fy
            operator: '>='
            threshold:
              value: 8.0
              unit: '%'
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 2.1.3(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - all_of:
        - check:
            id: bj_s1b_1
            metric: expected market cap
            input_path: offering.expected_market_cap_at_listing
            operator: '>='
            threshold:
              value: 200000000
              unit: CNY
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 2.1.3(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        - check:
            id: bj_s1b_2
            metric: latest-FY net profit
            input_path: financials.net_profit_regulatory_cn_latest
            operator: '>='
            threshold:
              value: 25000000
              unit: CNY
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 2.1.3(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
            guidance_note: 扣非前后孰低 basis (net profit & ROE per BSE rule)
        - check:
            id: bj_s1b_3
            metric: latest-FY weighted ROE
            input_path: financials.metrics[period={latest_audited_fy}].weighted_avg_roe
            operator: '>='
            threshold:
              value: 8.0
              unit: '%'
            threshold_verified: true
            effective_from: '2024-04-30'
            effective_from_verified: true
            verified_against: 2.1.3(一)
            verified_on: '2026-07-24'
            verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - all_of:
      - check:
          id: bj_s2_1
          metric: expected market cap
          input_path: offering.expected_market_cap_at_listing
          operator: '>='
          threshold:
            value: 400000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: bj_s2_2
          metric: avg revenue last 2 FYs
          input_path: financials.revenue_avg_2fy
          operator: '>='
          threshold:
            value: 100000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: bj_s2_3
          metric: latest-FY revenue YoY growth
          input_path: financials.revenue_yoy_growth_latest
          operator: '>='
          threshold:
            value: 30.0
            unit: '%'
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: bj_s2_4
          metric: latest-FY operating cash flow
          input_path: financials.cash_flow[period={latest_audited_fy}].net_operating_cash_flow
          operator: '>'
          threshold:
            value: 0
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(二)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - all_of:
      - check:
          id: bj_s3_1
          metric: expected market cap
          input_path: offering.expected_market_cap_at_listing
          operator: '>='
          threshold:
            value: 800000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(三)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: bj_s3_2
          metric: latest-FY revenue
          input_path: financials.income_statement[period={latest_audited_fy}].revenue
          operator: '>='
          threshold:
            value: 200000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(三)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: bj_s3_3
          metric: 2-yr R&D / 2-yr revenue
          input_path: financials.rd_ratio_2fy_cn
          operator: '>='
          threshold:
            value: 8.0
            unit: '%'
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(三)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
    - all_of:
      - check:
          id: bj_s4_1
          metric: expected market cap
          input_path: offering.expected_market_cap_at_listing
          operator: '>='
          threshold:
            value: 1500000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(四)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
      - check:
          id: bj_s4_2
          metric: 2-yr aggregate R&D expenditure
          input_path: financials.rd_agg_2fy_cn
          operator: '>='
          threshold:
            value: 50000000
            unit: CNY
          threshold_verified: true
          effective_from: '2024-04-30'
          effective_from_verified: true
          verified_against: 2.1.3(四)
          verified_on: '2026-07-24'
          verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
- id: csrc_art_11_negative_list
  title: CSRC precondition — 北交所注册管理办法 Art.11 negative list
  rule_ref: Art.11(一)-(三)
  effective_from: 2023-06
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: cs_bj_2
        metric: 'issuer/controlling shareholder/actual controller must NOT have: criminal offences (corruption/bribery/property/market
          order) in last 3 years; fraudulent issuance or major disclosure violations or national/public/eco/production/health-safety
          violations in last 3 years; CSRC administrative penalty in last 1 year'
        input_path: soft_legal_compliance_bse
        operator: ==
        threshold_verified: true
        effective_from: 2023-06
        effective_from_verified: true
        verified_against: Art.11(一)-(三)
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        guidance_note: Deterministic where records exist; deferred leaf for assessment
        requires_llm: true
- id: csrc_art_9_10
  title: CSRC precondition — 北交所注册管理办法 Art.9-10
  rule_ref: Art.9, Art.10
  effective_from: 2023-06
  evaluated: false
  human_signoff: false
  requires_llm: true
  stub_reason: deferred / complex / pending verification — not hard-evaluated this phase
  requirement:
    all_of:
    - check:
        id: cs_bj_1
        metric: 'issuance preconditions: NEEQ innovation-layer 12m (Art.9, mirrors BSE rule 2.1.2(一));
          sound organisation; going-concern capability + good financial condition; last 3 FYs financial
          reports free of false records AND unqualified audit opinions; lawful & compliant operation (Art.10(一)-(四))'
        input_path: profile_audit_opinion_type_3fy_soft_bse_going_concern
        operator: ==
        threshold_verified: true
        effective_from: 2023-06
        effective_from_verified: true
        verified_against: Art.9, Art.10
        verified_on: '2026-07-24'
        verified_by: 'claude_web_verification_2026-07-24 (internal review: Yuanjun 2026-07-24)'
        guidance_note: 《北交所向不特定合格投资者公开发行股票注册管理办法》(2023修订, 废止2021年令第187号)
        requires_llm: true
